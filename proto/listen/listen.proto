syntax = "proto3";

option go_package = "./listen";

service Listener {
  rpc Download(Link) returns (Reply) {}
  rpc Queue(Link) returns (Confirmation) {}
}

message Link {
  string    id = 1;
  string token = 2;
  string   url = 3;
}

message Reply {
  bool Finished = 1;
}

message Confirmation {
  bool added = 1;
}